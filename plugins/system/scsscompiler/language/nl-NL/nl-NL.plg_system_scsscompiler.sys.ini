SCSS_COMPILER_XML_DESC="<img style='float:left;' src='//lomart.fr/lomart.png'><div style='padding-left:120px;'><p>SCSS COMPILER compileert alle (.SCSS) bestanden in de folder SCSS van het actieve template  in (.CSS) bestanden met dezelfde naam, in de CSS folder van het actieve template.</p><p>Het maakt gebruik van het <a href='https://github.com/scssphp/scssphp' target='_blank'>script scssphp (version 2.1.0)</a></p><p>Documentatie kunt u vinden op de website <a href='//lomart.fr/extensions-blog/scss-compiler' target='_blank'>LOMART.FR</a></p><p>Vergeet de plugin niet <a href='index.php?option=com_plugins'>te activeren</a>.</p></div>"