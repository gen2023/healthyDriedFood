SCSS_COMPILER_XML_DESC="<img style='float:left;' src='//lomart.fr/lomart.png'><div style='padding-left:120px;'><p>SCSS COMPILER compiles all files (.SCSS) in folder SCSS for the active template on .CSS files with the same name in the active template CSS folder.</p><p>It uses the <a href='https://github.com/scssphp/scssphp'>script scssphp (version 2.0.1)</a></p><p>Documentation on website <a href='//lomart.fr/extensions/scss-compiler'>LOMART.FR</a></p><p>Do not forget to <a href='index.php?option=com_plugins'>activate the plugin</a></p></div>"